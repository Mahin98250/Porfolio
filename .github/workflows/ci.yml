name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Production builds and strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm and Turbo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .turbo
          key: ${{ runner.os }}-npm-turbo-${{ hashFiles('**/package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-turbo-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Doodhwala static app and security contracts
        run: cd apps/dudhwala && node scripts/validate-site.mjs && node scripts/test-security-contracts.mjs && node scripts/test-legal-contracts.mjs && node scripts/test-service-worker.mjs
      - name: Build deployed portfolio
        run: npm run build
      - name: Build Next.js static export
        env:
          PORTFOLIO_STATIC_EXPORT: "true"
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Build and verify standalone apps
        run: npm run build:apps
      - name: Lint workspace packages
        run: npm run lint:workspace
      - name: Typecheck workspace packages
        run: npm run typecheck
      - name: Run shared package unit tests
        run: npm test

  portfolio-build:
    name: Build and verify deployable portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the Vite portfolio entry point
        run: npm run build
      - name: Build the GitHub Pages portfolio
        env:
          PORTFOLIO_STATIC_EXPORT: "true"
          PORTFOLIO_BASE_PATH: "/Porfolio"
          NEXT_PUBLIC_SITE_URL: "https://mahin98250.github.io/Porfolio"
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Assemble and verify the published static site
        env:
          PORTFOLIO_BASE_PATH: "/Porfolio"
        run: node scripts/prepare-doodhwala-pages.mjs && node scripts/verify-pages-export.mjs

  browser-regression:
    name: Playwright route regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm and Turbo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .turbo
          key: ${{ runner.os }}-npm-turbo-${{ hashFiles('**/package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-turbo-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js static export for browser tests
        env:
          PORTFOLIO_STATIC_EXPORT: "true"
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e --workspace=@mahin/portfolio-next

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm audit dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-audit-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-audit-
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complete dependency tree
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/check-audit.mjs npm-audit.json
      - name: Upload dependency audit report
        if: always() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14

  config-format:
    name: Configuration formatting
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JSON formatting
        run: npx --yes prettier@3.5.3 --check turbo.json tsconfig.base.json packages/marketplace-data/package.json packages/marketplace-data/tsconfig.json apps/portfolio/package.json apps/portfolio/tsconfig.json apps/dudhwala-workspace/package.json

  deploy:
    name: Deploy verified portfolio to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [portfolio-build, browser-regression, config-format]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm and Turbo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .turbo
          key: ${{ runner.os }}-npm-turbo-${{ hashFiles('**/package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-turbo-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build GitHub Pages static export
        env:
          PORTFOLIO_STATIC_EXPORT: "true"
          PORTFOLIO_BASE_PATH: "/Porfolio"
          NEXT_PUBLIC_SITE_URL: "https://mahin98250.github.io/Porfolio"
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Include Doodhwala marketplace
        env:
          PORTFOLIO_BASE_PATH: "/Porfolio"
        run: node scripts/prepare-doodhwala-pages.mjs && node scripts/verify-pages-export.mjs
      - name: Ensure GitHub Pages serves Next.js assets
        run: printf 'GitHub Pages static export; Jekyll processing disabled.\n' > apps/portfolio/out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portfolio/out
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@v4
