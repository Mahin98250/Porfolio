name: Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Production builds and strict typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm and Turbo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .turbo
          key: ${{ runner.os }}-npm-turbo-${{ hashFiles('**/package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-turbo-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build deployed portfolio
        run: npm run build
      - name: Build Next.js App Router portfolio
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Lint workspace packages
        run: npm run lint:workspace
      - name: Typecheck workspace packages
        run: npm run typecheck
      - name: Run shared package unit tests
        run: npm test

  browser-regression:
    name: Playwright route regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm and Turbo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            .turbo
          key: ${{ runner.os }}-npm-turbo-${{ hashFiles('**/package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-turbo-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js app for browser tests
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e --workspace=@mahin/portfolio-next

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm audit dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-audit-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-audit-
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complete dependency tree
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/check-audit.mjs npm-audit.json
      - name: Upload dependency audit report
        if: always() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14

  config-format:
    name: Configuration formatting
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify JSON formatting
        run: npx --yes prettier@3.5.3 --check turbo.json tsconfig.base.json packages/marketplace-data/package.json packages/marketplace-data/tsconfig.json apps/portfolio/package.json apps/portfolio/tsconfig.json
