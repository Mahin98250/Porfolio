name: Manual GitHub Pages deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js static export
        env:
          PORTFOLIO_STATIC_EXPORT: "true"
          PORTFOLIO_BASE_PATH: "/Porfolio"
          NEXT_PUBLIC_SITE_URL: "https://mahin98250.github.io/Porfolio"
        run: npm run build --workspace=@mahin/portfolio-next
      - name: Include Doodhwala marketplace
        env:
          PORTFOLIO_BASE_PATH: "/Porfolio"
        run: node scripts/prepare-doodhwala-pages.mjs && node scripts/verify-pages-export.mjs
      - name: Ensure GitHub Pages serves Next.js assets
        run: printf 'GitHub Pages static export; Jekyll processing disabled.\n' > apps/portfolio/out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portfolio/out
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
